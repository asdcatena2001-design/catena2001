:root{
  --navy:#0A1A30; --navy-deep:#060F1D; --surface:#122741; --surface-2:#1B3A5E;
  --oro:#ECCA33; --rosso:#ED1F24; --verde:#1F9E52; --bianco:#FFFFFF;
  --muto:#8FA3BC; --linea:rgba(143,163,188,.22);
  --num:'Bahn',ui-sans-serif,system-ui,sans-serif;
  --lab:'BahnC',ui-sans-serif,system-ui,sans-serif;
  --ui:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--navy-deep);color:var(--bianco);font-family:var(--ui);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- scoreboard: replica di Risultato.png (582x78 su 1920x1080) ---------- */
.sb-wrap{padding:10px 10px 0}
.sb{position:relative;width:100%;aspect-ratio:582/78;background:var(--navy);border-radius:3px;
    overflow:hidden;font-variant-numeric:tabular-nums;container-type:inline-size}
.sb-accento{position:absolute;left:0;top:0;bottom:0;width:2.06%;background:var(--rosso)}
.sb-filetto{position:absolute;left:0;right:0;bottom:0;height:5.1%;background:var(--oro)}
.sb-slot{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;line-height:1}
.sb-cat  {left:2.06%; width:20.96%;background:var(--bianco);color:var(--navy);font-family:var(--lab);letter-spacing:.06em;font-size:7.22cqw}
.sb-n1   {left:23.02%;width:13.40%;background:#0d2039;color:var(--bianco);font-family:var(--num);font-size:7.90cqw}
.sb-n2   {left:36.77%;width:13.40%;background:#0d2039;color:var(--bianco);font-family:var(--num);font-size:7.90cqw}
.sb-sigla{left:50.17%;width:20.96%;background:var(--bianco);color:var(--navy);font-family:var(--lab);letter-spacing:.06em;font-size:7.22cqw}
.sb-tempo{left:71.13%;width:28.87%;background:var(--rosso);color:var(--bianco);font-family:var(--num);font-size:6.87cqw;letter-spacing:.02em}

.stato{display:flex;align-items:center;gap:10px;padding:9px 14px 8px;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muto);font-weight:700}
.stato .fase{color:var(--oro)}
.stato .dx{margin-left:auto;display:flex;align-items:center;gap:7px}
.pallino{width:9px;height:9px;border-radius:50%;background:var(--muto);flex:none}
.pallino.on{background:var(--verde);animation:respiro 2s ease-in-out infinite}
.pallino.ko{background:var(--rosso)}
@keyframes respiro{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pallino.on{animation:none}}

.gol{display:flex;flex-direction:column;gap:8px;padding:4px 10px}
.big{position:relative;min-height:16.5vh;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-family:var(--lab);
  font-size:clamp(28px,8.4vw,44px);letter-spacing:.03em;transition:transform .06s ease,filter .06s ease}
.big:active{transform:scale(.975);filter:brightness(1.12)}
.big .titolo{display:block;white-space:nowrap}
.big .sotto{font-family:var(--ui);font-size:11px;font-weight:800;letter-spacing:.16em;opacity:.62}
.big.noi{background:var(--oro);color:var(--navy)}
.big.loro{background:var(--rosso);color:var(--bianco)}
.big[disabled]{opacity:.34;filter:grayscale(.5)}

/* tiro subito: frequente, quindi riga sua con il conteggio sempre in vista */
.tiro{margin:0 10px;padding:13px;border-radius:10px;background:var(--surface);
  border:1px solid var(--linea);display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muto)}
.tiro:active{background:var(--surface-2)}
.tiro .conta{font-family:var(--num);font-size:24px;color:var(--bianco);letter-spacing:0}
.tiro[disabled]{opacity:.32}

.minori{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 10px}
.min{background:var(--surface);border:1px solid var(--linea);border-radius:10px;padding:11px 4px;
  display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muto)}
.min:active{background:var(--surface-2)}
.min .icona{font-family:var(--lab);font-size:19px;color:var(--bianco);line-height:1}
.min.annulla .icona{color:var(--muto)}
.min[disabled]{opacity:.32}

.fase-btn{margin:6px 10px 10px;padding:16px;border-radius:12px;background:transparent;
  border:2px solid var(--oro);color:var(--oro);font-family:var(--lab);font-size:20px;letter-spacing:.1em}
.fase-btn:active{background:var(--oro);color:var(--navy)}
.fase-btn.finita{border-color:var(--verde);color:var(--verde)}

.log{flex:1;overflow-y:auto;padding:0 10px 20px;display:flex;flex-direction:column;gap:5px;min-height:70px}
.log-vuoto{color:var(--muto);font-size:13px;text-align:center;padding:22px 10px;line-height:1.6}
.riga{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:8px;padding:9px 11px;font-size:14px}
.riga .min-t{font-family:var(--num);font-size:17px;color:var(--oro);min-width:44px;font-variant-numeric:tabular-nums}
.riga .testo{flex:1;font-weight:600}
.riga .testo small{display:block;font-weight:600;font-size:11.5px;color:var(--muto);letter-spacing:.04em;margin-top:2px}
.riga .cam{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--navy);background:var(--muto);border-radius:4px;padding:3px 6px}
.riga .x{color:var(--muto);font-size:20px;padding:2px 6px;line-height:1}
.riga.ev-loro{box-shadow:inset 3px 0 0 var(--rosso)}
.riga.ev-noi{box-shadow:inset 3px 0 0 var(--oro)}
.riga.ev-fase{background:transparent;border:1px dashed var(--linea);color:var(--muto);font-size:12px}
.riga.ev-fase .min-t{color:var(--muto);font-size:14px}
.riga.manca{box-shadow:inset 3px 0 0 var(--oro),0 0 0 1px rgba(236,202,51,.45)}

.flash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:24px;text-align:center;animation:entra .12s ease-out}
@keyframes entra{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.flash .titolo{font-family:var(--lab);font-size:clamp(42px,15vw,84px);letter-spacing:.02em;line-height:.95;text-wrap:balance}
.flash .dett{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.flash .undo{margin-top:10px;border:2px solid currentColor;border-radius:10px;padding:13px 30px;
  font-weight:800;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.flash.noi{background:var(--oro);color:var(--navy)}
.flash.loro{background:var(--rosso);color:var(--bianco)}
.flash.neutro{background:var(--surface);color:var(--bianco)}

.pannello{position:fixed;inset:0;z-index:70;background:var(--navy-deep);overflow-y:auto;
  padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
.pannello .dentro{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--lab);font-size:30px;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-family:var(--lab);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);margin:0 0 9px}
.gruppo{background:var(--surface);border-radius:12px;padding:15px}
.spiega{font-size:13px;color:var(--muto);line-height:1.55;margin:8px 0 0}
.scelte{display:flex;flex-wrap:wrap;gap:7px}
.scelta{border:1px solid var(--linea);border-radius:8px;padding:10px 13px;font-size:14px;
  font-weight:700;background:var(--navy);color:var(--muto)}
.scelta[aria-pressed="true"]{background:var(--oro);color:var(--navy);border-color:var(--oro)}
.scelta.due{flex:1;min-width:130px;text-align:center}
.scelta.squadra{flex:1 1 108px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px}
.scelta.squadra .sg{font-family:var(--lab);font-size:19px;letter-spacing:.05em;color:var(--bianco)}
.scelta.squadra .nm{font-size:10px;font-weight:700;line-height:1.25;opacity:.72}
.scelta.squadra[aria-pressed="true"] .sg{color:var(--navy)}
input[type=text],input[type=number]{background:var(--navy);border:1px solid var(--linea);border-radius:8px;
  color:var(--bianco);padding:11px 12px;font-size:15px;font-family:inherit;width:100%}
input:focus-visible{outline:2px solid var(--oro);outline-offset:1px}
.primario{background:var(--oro);color:var(--navy);border-radius:12px;padding:17px;
  font-family:var(--lab);font-size:20px;letter-spacing:.08em;width:100%}
.secondario{border:1px solid var(--linea);border-radius:10px;padding:13px;font-size:13px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muto);width:100%}
.rosa-riga{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.rosa-riga input[type=number]{width:60px;text-align:center;font-family:var(--num);font-size:17px}
.rosa-riga .por{flex:none;width:44px;border:1px solid var(--linea);border-radius:8px;padding:10px 0;
  font-family:var(--lab);font-size:13px;color:var(--muto);background:var(--navy)}
.rosa-riga .por[aria-pressed="true"]{background:var(--verde);color:#fff;border-color:var(--verde)}
.rosa-riga .togli{color:var(--muto);font-size:22px;padding:0 6px}

.convocati{display:flex;flex-direction:column;gap:6px}
.conv{display:flex;align-items:center;gap:11px;background:var(--navy);border:1px solid var(--linea);
  border-radius:9px;padding:11px 13px;text-align:left;width:100%}
.conv[aria-pressed="true"]{border-color:var(--oro);background:rgba(236,202,51,.10)}
.conv .spunta{width:22px;height:22px;border-radius:5px;border:2px solid var(--linea);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.conv[aria-pressed="true"] .spunta{background:var(--oro);border-color:var(--oro);color:var(--navy)}
.conv .n{font-family:var(--num);font-size:19px;color:var(--oro);min-width:30px}
.conv .nm{font-family:var(--lab);font-size:17px;letter-spacing:.03em;flex:1}
.conv .ruolo{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--verde)}

.marcatori{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.marc{background:var(--surface);border:1px solid var(--linea);border-radius:10px;padding:15px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.marc .n{font-family:var(--num);font-size:24px;color:var(--oro);line-height:1}
.marc .nm{font-family:var(--lab);font-size:14px;letter-spacing:.03em;text-align:center}
.marc:active{background:var(--oro)}
.marc:active .n,.marc:active .nm{color:var(--navy)}
textarea{width:100%;height:150px;background:var(--navy);border:1px solid var(--linea);border-radius:8px;
  color:var(--muto);font-family:ui-monospace,monospace;font-size:11px;padding:11px;resize:vertical}
.riepilogo{font-size:14px;line-height:1.75}
.riepilogo b{font-family:var(--num);color:var(--oro);font-size:17px}
.nascosto{display:none !important}
</style>
</head>
<body>

<div class="app">
  <div class="sb-wrap">
    <div class="sb" id="sb">
      <div class="sb-accento"></div>
      <div class="sb-slot sb-cat">CAT</div>
      <div class="sb-slot sb-n1" id="sbN1">0</div>
      <div class="sb-slot sb-n2" id="sbN2">0</div>
      <div class="sb-slot sb-sigla" id="sbSigla">OSP</div>
      <div class="sb-slot sb-tempo" id="sbTempo">00:00</div>
      <div class="sb-filetto"></div>
    </div>
  </div>

  <div class="stato">
    <span class="fase" id="lblFase">PRIMA DEL VIA</span>
    <span class="dx"><span class="pallino" id="micDot"></span><span id="lblMic">voce spenta</span></span>
  </div>

  <div class="gol">
    <button class="big noi" id="btnNoi"><span class="titolo">GOL CATENA</span><span class="sotto" id="subNoi">poi marcatore e assist</span></button>
    <button class="big loro" id="btnLoro"><span class="titolo">GOL <span id="lblSiglaBtn">OSPITI</span></span><span class="sotto">gol subito</span></button>
  </div>

  <button class="tiro" id="btnTiro">Tiro subito<span class="conta" id="contaTiri">0</span></button>

  <div class="minori">
    <button class="min" id="btnClip"><span class="icona">★</span>Azione</button>
    <button class="min" id="btnGiallo"><span class="icona" style="color:var(--oro)">▮</span>Giallo</button>
    <button class="min" id="btnRosso"><span class="icona" style="color:var(--rosso)">▮</span>Rosso</button>
    <button class="min annulla" id="btnAnnulla"><span class="icona">↺</span>Annulla</button>
  </div>

  <button class="fase-btn" id="btnFase">TELEFONI AVVIATI</button>
  <div class="log" id="log"></div>
</div>

<script>
"use strict";
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ====================== stato ====================== */
const K_PARTITA = 'catena.partita.v5', K_ROSA = 'catena.rosa.v5';

const SQUADRE = [
 ["Albana Commando","ALB"],["Birra Real","BIR"],["CRV 96","CRV"],["Divin Drovini","DIV"],
 ["FC Skutari","SKU"],["Ho Chi Minh","HCM"],["Los Borrachos","LOS"],["Parchino Team","PAR"],
 ["Pistoia Centro Il Gabri","PCG"],["Popiglio C5","POP"],["Poseidon","POS"],["S6C","S6C"],
 ["Sporting Club Pistoiese","SCP"]
];

const FASI = [
 {k:'attesa', lbl:'PRIMA DEL VIA',   btn:'TELEFONI AVVIATI', ev:'sync',    dopo:'via'},
 {k:'via',    lbl:'TELEFONI ACCESI', btn:"CALCIO D'INIZIO",  ev:'inizio1', dopo:'t1'},
 {k:'t1',     lbl:'1° TEMPO',        btn:'FINE 1° TEMPO',    ev:'fine1',   dopo:'int'},
 {k:'int',    lbl:'INTERVALLO',      btn:'INIZIO 2° TEMPO',  ev:'inizio2', dopo:'t2'},
 {k:'t2',     lbl:'2° TEMPO',        btn:'FINE PARTITA',     ev:'fine2',   dopo:'fine'},
 {k:'fine',   lbl:'PARTITA FINITA',  btn:'CONTROLLA E INVIA',ev:null,      dopo:null}
];

let P = null, rosa = [];

function nuovaPartita(){
  return {v:5, id:'m'+Date.now(), creata:Date.now(),
    giornata:null, avversario:{nome:'',sigla:'OSP'},
    catenaAttaccaVerso:'A', fase:'attesa', eventi:[], convocati:[],
    fuso:Intl.DateTimeFormat().resolvedOptions().timeZone,
    scartoFuso:new Date().getTimezoneOffset()};
}
function salva(){try{localStorage.setItem(K_PARTITA,JSON.stringify(P));localStorage.setItem(K_ROSA,JSON.stringify(rosa));}catch(e){}}
function carica(){
  try{const a=localStorage.getItem(K_PARTITA); if(a){const o=JSON.parse(a); if(o&&o.v===5)P=o;}}catch(e){}
  try{const b=localStorage.getItem(K_ROSA); if(b)rosa=JSON.parse(b)||[];}catch(e){}
  if(!P)P=nuovaPartita();
}

/* ====================== tempo di gioco ====================== */
const ev1 = t => P.eventi.find(e=>e.tipo===t);
function msDiGioco(t){
  const i1=ev1('inizio1'), f1=ev1('fine1'), i2=ev1('inizio2');
  if(!i1) return null;
  if(!i2 || t < i2.t) return Math.max(0, t - i1.t);
  return (f1 ? f1.t - i1.t : 0) + Math.max(0, t - i2.t);
}
const mmss = ms => {const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function minutoGara(t){const ms=msDiGioco(t); return ms===null?null:Math.floor(ms/60000)+1;}

function telecamera(e){
  if(e.tipo!=='gol') return null;
  const secondo = !!(ev1('inizio2') && e.t >= ev1('inizio2').t);
  const A = P.catenaAttaccaVerso==='A';
  const catenaAttaccaA = secondo ? !A : A;
  return (e.squadra==='noi') === catenaAttaccaA ? 'A' : 'B';
}

/* ====================== segnali ====================== */
let ac=null;
function bip(freqs,dur){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), t0=ac.currentTime+i*dur;
      o.type='square'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(.28,t0+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur+.02);
    });
  }catch(e){}
}
const vibra = p => {try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

/* ====================== eventi ====================== */
function aggiungi(tipo,extra){
  const e=Object.assign({id:'e'+Date.now()+Math.random().toString(36).slice(2,6),t:Date.now(),tipo},extra||{});
  P.eventi.push(e); salva(); disegna(); return e;
}
function rimuovi(id){
  const i=P.eventi.findIndex(e=>e.id===id); if(i<0)return;
  const f=FASI.find(f=>f.ev===P.eventi[i].tipo);
  if(f) P.fase=f.k;
  P.eventi.splice(i,1); salva(); disegna();
}
function ultimoAnnullabile(){
  for(let i=P.eventi.length-1;i>=0;i--){
    const t=P.eventi[i].tipo;
    if(t==='gol'||t==='giallo'||t==='rosso'||t==='clip'||t==='tiroSubito') return P.eventi[i];
  }
  return null;
}
const punteggio = () => ({
  noi:P.eventi.filter(e=>e.tipo==='gol'&&e.squadra==='noi').length,
  loro:P.eventi.filter(e=>e.tipo==='gol'&&e.squadra==='loro').length});
const tiriSubiti = () => P.eventi.filter(e=>e.tipo==='tiroSubito').length;
const plur = (n,uno,molti) => n+' '+(n===1?uno:molti);
const convocati = () => (P.convocati&&P.convocati.length) ? P.convocati : rosa;

function segnaGol(squadra){
  const e=aggiungi('gol',{squadra,marcatore:null,assist:null});
  const p=punteggio();
  if(squadra==='noi'){bip([660,880,1180],.11);vibra([40,45,110]);}
  else{bip([320,220],.16);vibra([170]);}
  flash(squadra==='noi'?'noi':'loro', squadra==='noi'?'GOL!':'GOL LORO',
        `${p.noi} — ${p.loro}   ·   ${minutoGara(e.t)||'?'}'`, e.id);
  if(squadra==='noi' && convocati().length) setTimeout(()=>chiediMarcatore(e.id),950);
}

/* ====================== conferma a tutto schermo ====================== */
let flashTimer=null;
function flash(stile,titolo,dett,idAnnulla){
  chiudiFlash();
  const d=document.createElement('div');
  d.className='flash '+stile;
  d.innerHTML='<div class="titolo"></div><div class="dett"></div>';
  d.querySelector('.titolo').textContent=titolo;
  d.querySelector('.dett').textContent=dett||'';
  if(idAnnulla){
    const b=document.createElement('button');
    b.className='undo'; b.textContent='✕  Annulla';
    b.onclick=ev=>{ev.stopPropagation();rimuovi(idAnnulla);chiudiFlash();bip([300,200],.09);};
    d.appendChild(b);
  }
  d.addEventListener('click',chiudiFlash);
  document.body.appendChild(d);
  flashTimer=setTimeout(chiudiFlash,3200);
}
function chiudiFlash(){clearTimeout(flashTimer);document.querySelectorAll('.flash').forEach(n=>n.remove());}

/* ====================== marcatore e assist ====================== */
function griglia(elenco, escludi){
  return elenco.filter(g=>!escludi||g.nome!==escludi)
    .map(g=>`<button class="marc" data-n="${g.n==null?'':g.n}" data-nome="${g.nome}">
      <span class="n">${g.n==null?'&nbsp;':g.n}</span><span class="nm">${g.nome}</span></button>`).join('');
}

function chiediMarcatore(idGol){
  const e=P.eventi.find(x=>x.id===idGol); if(!e) return;
  const p=document.createElement('div'); p.className='pannello';
  p.innerHTML=`<div class="dentro">
      <h1>Chi ha segnato?</h1>
      <div class="marcatori">${griglia(convocati())}</div>
      <button class="secondario" id="salta">Non adesso — lo metto a fine partita</button>
    </div>`;
  p.querySelectorAll('.marc').forEach(b=>b.onclick=()=>{
    e.marcatore={n:b.dataset.n===''?null:+b.dataset.n, nome:b.dataset.nome};
    salva(); disegna(); p.remove(); bip([880],.07); vibra(25);
    setTimeout(()=>chiediAssist(idGol),260);
  });
  p.querySelector('#salta').onclick=()=>p.remove();
  document.body.appendChild(p);
}

function chiediAssist(idGol){
  const e=P.eventi.find(x=>x.id===idGol); if(!e) return;
  const suo=(e.marcatore||{}).nome;
  const p=document.createElement('div'); p.className='pannello';
  p.innerHTML=`<div class="dentro">
      <h1>Assist di chi?</h1>
      <p class="spiega" style="margin:0">Gol di <b>${suo||'—'}</b>. Se è nato da solo, tocca «nessun assist».</p>
      <div class="marcatori">${griglia(convocati(), suo)}</div>
      <button class="secondario" id="nessuno">Nessun assist</button>
      <button class="secondario" id="salta">Lo metto a fine partita</button>
    </div>`;
  p.querySelectorAll('.marc').forEach(b=>b.onclick=()=>{
    e.assist={n:b.dataset.n===''?null:+b.dataset.n, nome:b.dataset.nome};
    salva(); disegna(); p.remove(); bip([740,980],.07); vibra(25);
  });
  p.querySelector('#nessuno').onclick=()=>{e.assist='nessuno';salva();disegna();p.remove();bip([520],.06);};
  p.querySelector('#salta').onclick=()=>p.remove();
  document.body.appendChild(p);
}

/* ====================== riconoscimento vocale ====================== */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, micAcceso=false, micVivo=false;
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();

function interpreta(txt){
  const s=norm(txt);
  if(/\b(annulla|cancella|sbagliato|errore|niente)\b/.test(s)) return {a:'annulla'};
  if(/\b(tiro|parata|conclusione)\b/.test(s)) return {a:'tiro'};
  if(/\bcartellino rosso\b|\bespuls/.test(s)) return {a:'rosso'};
  if(/\bcartellino giallo\b|\bgiallo\b|\bammonit/.test(s)) return {a:'giallo'};
  if(/\b(gol|goal|rete)\b/.test(s)){
    if(/\b(loro|subito|avversar|contro|preso)\b/.test(s)) return {a:'gol',sq:'loro'};
    return {a:'gol',sq:'noi'};
  }
  if(/\b(clip|salva|bella|azione|occasione)\b/.test(s)) return {a:'clip'};
  if(/\bfine partita\b|\bfinita\b|\bfine gara\b/.test(s)) return {a:'fase',k:'fine2'};
  if(/\bfine primo\b|\bfine tempo\b|\bintervallo\b/.test(s)) return {a:'fase',k:'fine1'};
  if(/\b(secondo tempo|ripresa|ripartit)\b/.test(s)) return {a:'fase',k:'inizio2'};
  if(/\b(inizio|via|partit[oi]|calcio d.inizio)\b/.test(s)) return {a:'fase',k:'inizio1'};
  return null;
}

function eseguiVoce(c){
  if(!c) return;
  const inGioco = (P.fase==='t1'||P.fase==='t2');
  if(c.a==='annulla'){const e=ultimoAnnullabile(); if(e){rimuovi(e.id);bip([300,200],.1);vibra([60,50,60]);flash('neutro','ANNULLATO','ultimo evento rimosso');} return;}
  if(!inGioco && c.a!=='fase') return;
  if(c.a==='gol'){segnaGol(c.sq); return;}
  if(c.a==='tiro'){segnaTiro(); return;}
  if(c.a==='giallo'||c.a==='rosso'){
    const e=aggiungi(c.a,{squadra:'noi'}); bip([520],.12); vibra(70);
    flash('neutro','CARTELLINO '+c.a.toUpperCase(),'tocca la riga nel log per correggere la squadra',e.id); return;
  }
  if(c.a==='clip'){const e=aggiungi('clip',{}); bip([740,740],.07); vibra(40); flash('neutro','AZIONE SALVATA','sarà negli highlights',e.id); return;}
  if(c.a==='fase'){
    const corrente=FASI.find(f=>f.k===P.fase);
    if(!corrente || corrente.ev!==c.k || ev1(c.k)) return;
    aggiungi(c.k,{}); P.fase=corrente.dopo; salva(); disegna();
    bip([620,760],.1); vibra(60); flash('neutro',corrente.btn,'registrato');
  }
}

function avviaMic(){
  if(!SR){aggiornaMic();return;}
  micAcceso=true;
  rec=new SR(); rec.lang='it-IT'; rec.continuous=true; rec.interimResults=false; rec.maxAlternatives=3;
  rec.onstart=()=>{micVivo=true;aggiornaMic();};
  rec.onresult=ev=>{
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      if(!ev.results[i].isFinal) continue;
      let c=null;
      for(let a=0;a<ev.results[i].length && !c;a++) c=interpreta(ev.results[i][a].transcript);
      if(c) eseguiVoce(c);
    }
  };
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micAcceso=false;micVivo=false;aggiornaMic();}};
  rec.onend=()=>{micVivo=false;aggiornaMic();if(micAcceso)setTimeout(()=>{try{rec.start();}catch(e){}},350);};
  try{rec.start();}catch(e){}
  aggiornaMic();
}
function spegniMic(){micAcceso=false;micVivo=false;try{rec&&rec.stop();}catch(e){}aggiornaMic();}
function aggiornaMic(){
  const d=document.getElementById('micDot'), l=document.getElementById('lblMic');
  if(!SR){d.className='pallino ko';l.textContent='voce non disponibile';return;}
  if(!micAcceso){d.className='pallino';l.textContent='voce spenta';return;}
  d.className='pallino '+(micVivo?'on':'ko');
  l.textContent=micVivo?'in ascolto':'riavvio…';
}

let wl=null;
async function tieniAcceso(){try{if('wakeLock' in navigator) wl=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tieniAcceso();});

/* ====================== disegno ====================== */
function segnaTiro(){
  const e=aggiungi('tiroSubito',{}); bip([420],.06); vibra(18);
  document.getElementById('contaTiri').textContent=tiriSubiti();
  return e;
}
function descrizione(e){
  if(e.tipo==='gol'){
    if(e.squadra!=='noi') return 'GOL '+P.avversario.sigla;
    const m=(e.marcatore||{}).nome;
    let sotto='';
    if(!m) sotto='marcatore da mettere';
    else if(e.assist==='nessuno') sotto='senza assist';
    else if(e.assist&&e.assist.nome) sotto='assist '+e.assist.nome;
    else sotto='assist da mettere';
    return {t:'GOL CATENA'+(m?' — '+m:''), s:sotto};
  }
  if(e.tipo==='giallo') return 'Giallo '+(e.squadra==='noi'?'Catena':P.avversario.sigla);
  if(e.tipo==='rosso')  return 'Rosso '+(e.squadra==='noi'?'Catena':P.avversario.sigla);
  if(e.tipo==='clip')   return 'Azione da tenere';
  if(e.tipo==='tiroSubito') return 'Tiro subito';
  const f=FASI.find(f=>f.ev===e.tipo); return f?f.btn:e.tipo;
}
function disegna(){
  const p=punteggio();
  document.getElementById('sbN1').textContent=p.noi;
  document.getElementById('sbN2').textContent=p.loro;
  document.getElementById('sbSigla').textContent=P.avversario.sigla||'OSP';
  document.getElementById('lblSiglaBtn').textContent=P.avversario.sigla||'OSPITI';
  document.getElementById('contaTiri').textContent=tiriSubiti();
  const fase=FASI.find(f=>f.k===P.fase)||FASI[0];
  document.getElementById('lblFase').textContent=fase.lbl;
  const bf=document.getElementById('btnFase');
  bf.textContent=fase.btn; bf.classList.toggle('finita',fase.k==='fine');
  const inGioco=(P.fase==='t1'||P.fase==='t2');
  ['btnNoi','btnLoro','btnClip','btnGiallo','btnRosso','btnTiro'].forEach(id=>document.getElementById(id).disabled=!inGioco);
  document.getElementById('btnAnnulla').disabled=!ultimoAnnullabile();

  const log=document.getElementById('log');
  if(!P.eventi.length){
    log.innerHTML='<div class="log-vuoto">Nessun evento.<br>Premi <b>TELEFONI AVVIATI</b> nel momento esatto in cui fai partire la registrazione sui due telefoni.</div>';
    return;
  }
  log.innerHTML='';
  [...P.eventi].reverse().forEach(e=>{
    const m=minutoGara(e.t), cam=telecamera(e), fase=FASI.some(f=>f.ev===e.tipo);
    const d=descrizione(e), testo=(typeof d==='string')?d:d.t, sotto=(typeof d==='string')?'':d.s;
    const manca = e.tipo==='gol'&&e.squadra==='noi'&&(!(e.marcatore||{}).nome || !e.assist);
    const r=document.createElement('div');
    r.className='riga '+(fase?'ev-fase':(e.tipo==='gol'?(e.squadra==='noi'?'ev-noi':'ev-loro'):''))+(manca?' manca':'');
    r.innerHTML=`<span class="min-t">${fase?new Date(e.t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):(m?m+"'":'—')}</span>
                 <span class="testo"></span>${cam?`<span class="cam">TEL ${cam}</span>`:''}<button class="x" aria-label="Elimina">✕</button>`;
    const cel=r.querySelector('.testo');
    cel.textContent=testo;
    if(sotto){const s=document.createElement('small');s.textContent=sotto;cel.appendChild(s);}
    r.querySelector('.x').onclick=()=>{if(confirm('Elimino "'+testo+'"?'))rimuovi(e.id);};
    if(e.tipo==='gol'&&e.squadra==='noi') cel.onclick=()=>{ (e.marcatore||{}).nome ? chiediAssist(e.id) : chiediMarcatore(e.id); };
    if(e.tipo==='giallo'||e.tipo==='rosso') cel.onclick=()=>{e.squadra=e.squadra==='noi'?'loro':'noi';salva();disegna();};
    log.appendChild(r);
  });
}
setInterval(()=>{
  const ms=msDiGioco(Date.now());
  let mostra='00:00';
  if(ms!==null){
    if(P.fase==='t1'||P.fase==='t2') mostra=mmss(ms);
    else{const ult=ev1('fine2')||ev1('fine1'); mostra=ult?mmss(msDiGioco(ult.t)):mmss(ms);}
  }
  document.getElementById('sbTempo').textContent=mostra;
},500);

/* ====================== impostazioni ====================== */
function apriSetup(){
  const p=document.createElement('div'); p.className='pannello';
  p.innerHTML=`<div class="dentro">
    <h1>Nuova partita</h1>

    <div class="gruppo">
      <h2>Giornata di campionato</h2>
      <input type="number" id="giornata" inputmode="numeric" min="1" max="40" placeholder="es. 26">
      <p class="spiega">Finisce sulla copertina del post Instagram.</p>
    </div>

    <div class="gruppo">
      <h2>Avversario</h2>
      <div class="scelte" id="squadre"></div>
      <p class="spiega">La sigla che scegli qui è quella che comparirà nello scoreboard del video.</p>
    </div>

    <div class="gruppo">
      <h2>Nel 1° tempo il Catena attacca verso…</h2>
      <div class="scelte">
        <button class="scelta due" data-lato="A" aria-pressed="false">la porta del TELEFONO A</button>
        <button class="scelta due" data-lato="B" aria-pressed="false">la porta del TELEFONO B</button>
      </div>
      <p class="spiega">Serve a scegliere da sola la telecamera giusta per ogni gol. Il cambio campo del 2° tempo lo calcola lei.</p>
    </div>

    <div class="gruppo">
      <h2>Rosa</h2>
      <div id="listaRosa"></div>
      <button class="secondario" id="piu" style="margin-top:8px">+ Aggiungi giocatore</button>
      <p class="spiega">Il tasto <b>POR</b> segna chi gioca in porta: la sua pagina Instagram avrà tiri e gol subiti invece di gol e assist. La rosa resta salvata per tutta la stagione.</p>
    </div>

    <div class="gruppo">
      <h2>Convocati di oggi</h2>
      <div class="convocati" id="listaConv"></div>
      <p class="spiega">Una pagina del post per ognuno, anche a zero gol e zero assist.</p>
    </div>

    <button class="primario" id="vai">Comincia</button>
    <button class="secondario" id="annullaSetup">Torna alla partita in corso</button>
  </div>`;

  p.querySelector('#giornata').value = P.giornata || '';
  const box=p.querySelector('#squadre');
  SQUADRE.forEach(([nome,sigla])=>{
    const b=document.createElement('button');
    b.className='scelta squadra';
    b.innerHTML='<span class="sg"></span><span class="nm"></span>';
    b.querySelector('.sg').textContent=sigla;
    b.querySelector('.nm').textContent=nome;
    b.setAttribute('aria-pressed', P.avversario.sigla===sigla?'true':'false');
    b.onclick=()=>{P.avversario={nome,sigla};box.querySelectorAll('.scelta').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');};
    box.appendChild(b);
  });
  p.querySelectorAll('[data-lato]').forEach(b=>{
    b.setAttribute('aria-pressed', P.catenaAttaccaVerso===b.dataset.lato?'true':'false');
    b.onclick=()=>{P.catenaAttaccaVerso=b.dataset.lato;
      p.querySelectorAll('[data-lato]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');};
  });

  const lista=p.querySelector('#listaRosa'), listaC=p.querySelector('#listaConv');
  let scelti = new Set((P.convocati||[]).map(g=>g.nome));

  function disegnaConvocati(){
    listaC.innerHTML='';
    const validi=rosa.filter(g=>g.nome&&g.nome.trim());
    if(!validi.length){listaC.innerHTML='<p class="spiega" style="margin:0">Prima compila la rosa qui sopra.</p>';return;}
    validi.forEach(g=>{
      const b=document.createElement('button');
      b.className='conv'; b.setAttribute('aria-pressed', scelti.has(g.nome)?'true':'false');
      b.innerHTML=`<span class="spunta">✓</span><span class="n">${g.n==null?'':g.n}</span>
                   <span class="nm"></span>${g.portiere?'<span class="ruolo">POR</span>':''}`;
      b.querySelector('.nm').textContent=g.nome;
      b.onclick=()=>{scelti.has(g.nome)?scelti.delete(g.nome):scelti.add(g.nome);
        b.setAttribute('aria-pressed', scelti.has(g.nome)?'true':'false');};
      listaC.appendChild(b);
    });
  }
  function disegnaRosa(){
    lista.innerHTML='';
    rosa.forEach((g,i)=>{
      const r=document.createElement('div'); r.className='rosa-riga';
      r.innerHTML=`<input type="number" inputmode="numeric" value="${g.n==null?'':g.n}" placeholder="N">
                   <input type="text" value="" placeholder="COGNOME" autocapitalize="characters">
                   <button class="por" aria-pressed="${g.portiere?'true':'false'}">POR</button>
                   <button class="togli" aria-label="Togli">✕</button>`;
      const [inN,inNome]=r.querySelectorAll('input');
      inNome.value=g.nome||'';
      inN.oninput=()=>{g.n=inN.value===''?null:+inN.value;salva();};
      inNome.oninput=()=>{const vecchio=g.nome; g.nome=inNome.value.toUpperCase();
        if(scelti.has(vecchio)){scelti.delete(vecchio);scelti.add(g.nome);} salva();disegnaConvocati();};
      r.querySelector('.por').onclick=e=>{g.portiere=!g.portiere;
        e.target.setAttribute('aria-pressed',g.portiere?'true':'false');salva();disegnaConvocati();};
      r.querySelector('.togli').onclick=()=>{scelti.delete(g.nome);rosa.splice(i,1);salva();disegnaRosa();disegnaConvocati();};
      lista.appendChild(r);
    });
  }
  disegnaRosa(); disegnaConvocati();
  p.querySelector('#piu').onclick=()=>{rosa.push({n:null,nome:'',portiere:false});salva();disegnaRosa();};
  p.querySelector('#annullaSetup').onclick=()=>{p.remove();disegna();};
  p.querySelector('#vai').onclick=()=>{
    rosa=rosa.filter(g=>g.nome&&g.nome.trim());
    if(P.eventi.length && !confirm("C'è già una partita con "+P.eventi.length+' eventi. La butto via e ne comincio una nuova?')) return;
    const av=P.avversario, lato=P.catenaAttaccaVerso;
    const g=parseInt(p.querySelector('#giornata').value,10);
    const conv=rosa.filter(x=>scelti.has(x.nome)).map(x=>({n:x.n,nome:x.nome,portiere:!!x.portiere}));
    P=nuovaPartita(); P.avversario=av; P.catenaAttaccaVerso=lato;
    P.giornata=isNaN(g)?null:g; P.convocati=conv;
    salva(); p.remove(); disegna();
    if(SR&&!micAcceso) avviaMic();
    tieniAcceso();
  };
  document.body.appendChild(p);
}

/* ====================== riepilogo di fine partita ====================== */
function apriRiepilogo(){
  const gol=P.eventi.filter(e=>e.tipo==='gol'&&e.squadra==='noi');
  const daFare=gol.filter(e=>!(e.marcatore||{}).nome || !e.assist);
  const p=document.createElement('div'); p.className='pannello';
  p.innerHTML=`<div class="dentro">
    <h1>Controlla prima di inviare</h1>
    <div class="gruppo riepilogo" id="testa"></div>
    <div class="gruppo">
      <h2>Gol del Catena</h2>
      <div id="listaGol"></div>
      <p class="spiega" id="nota"></p>
    </div>
    <div class="gruppo" id="gruppoPortiere">
      <h2>Portiere</h2>
      <div class="rosa-riga"><span style="flex:1;font-size:14px">Tiri subiti</span>
        <input type="number" id="tiri" inputmode="numeric" min="0" style="width:90px"></div>
      <p class="spiega">Contati durante la partita. Correggi qui se ne sono sfuggiti.</p>
    </div>
    <button class="primario" id="invia">Vai all'invio</button>
    <button class="secondario" id="chiudi">Torna indietro</button>
  </div>`;

  function ridisegna(){
    const pt=punteggio();
    p.querySelector('#testa').innerHTML =
      `CATENA <b>${pt.noi}</b> — <b>${pt.loro}</b> ${P.avversario.sigla}<br>` +
      plur(P.convocati.length,'convocato','convocati') + ' · ' +
      plur(tiriSubiti(),'tiro subito','tiri subiti') + ' · ' +
      plur(P.eventi.filter(e=>e.tipo==='clip').length,'azione salvata','azioni salvate');
    const box=p.querySelector('#listaGol'); box.innerHTML='';
    gol.forEach(e=>{
      const m=(e.marcatore||{}).nome, a=(e.assist==='nessuno')?'senza assist':(e.assist||{}).nome;
      const manca=!m||!e.assist;
      const r=document.createElement('div');
      r.className='riga '+(manca?'manca':'ev-noi'); r.style.marginBottom='6px';
      r.innerHTML=`<span class="min-t">${minutoGara(e.t)||'—'}'</span><span class="testo"></span>`;
      const c=r.querySelector('.testo');
      c.textContent = m || 'marcatore mancante';
      const s=document.createElement('small'); s.textContent = a || 'assist mancante'; c.appendChild(s);
      r.onclick=()=>{ (m ? chiediAssist(e.id) : chiediMarcatore(e.id)); setTimeout(ridisegna,400); };
      box.appendChild(r);
    });
    const restano=gol.filter(e=>!(e.marcatore||{}).nome||!e.assist).length;
    p.querySelector('#nota').textContent = restano
      ? (restano===1
        ? 'Tocca la riga per completarla. Ne manca uno — puoi anche inviare così, il buco resterà vuoto nel post.'
        : `Tocca una riga per completarla. Ne mancano ${restano} — puoi anche inviare così, i buchi resteranno vuoti nel post.`)
      : 'Tutti i gol sono completi.';
  }
  const haPortiere = (P.convocati||[]).some(g=>g.portiere);
  if(!haPortiere) p.querySelector('#gruppoPortiere').classList.add('nascosto');
  const inTiri=p.querySelector('#tiri'); inTiri.value=tiriSubiti();
  inTiri.onchange=()=>{
    const voluti=Math.max(0,parseInt(inTiri.value,10)||0);
    let ora=tiriSubiti();
    while(ora<voluti){P.eventi.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,5),t:Date.now(),tipo:'tiroSubito',manuale:true});ora++;}
    while(ora>voluti){const i=P.eventi.map(e=>e.tipo).lastIndexOf('tiroSubito'); if(i<0)break; P.eventi.splice(i,1); ora--;}
    salva(); disegna(); ridisegna();
  };
  ridisegna();
  p.querySelector('#chiudi').onclick=()=>p.remove();
  p.querySelector('#invia').onclick=()=>{p.remove();apriEsporta();};
  document.body.appendChild(p);
}

/* ====================== esportazione ====================== */
function datiEsporta(){
  const i1=ev1('inizio1'), f1=ev1('fine1');
  const conv=(P.convocati&&P.convocati.length)?P.convocati:rosa.map(g=>({n:g.n,nome:g.nome,portiere:!!g.portiere}));
  return {
    formato:'catena-log/5', partita:P.id, creata:new Date(P.creata).toISOString(),
    giornata:P.giornata||null, fuso:P.fuso, scartoFusoMin:P.scartoFuso,
    avversario:P.avversario, catenaAttaccaVerso:P.catenaAttaccaVerso,
    durataPrimoTempoMs:(i1&&f1)?f1.t-i1.t:null,
    punteggio:punteggio(),
    portiere:{tiriSubiti:tiriSubiti(), golSubiti:punteggio().loro},
    rosa, convocati:conv,
    eventi:P.eventi.filter(e=>e.tipo!=='tiroSubito').map(e=>({
      id:e.id, tipo:e.tipo, squadra:e.squadra||null,
      oraAssoluta:new Date(e.t).toISOString(), epochMs:e.t,
      msDiGioco:msDiGioco(e.t), minuto:minutoGara(e.t),
      marcatore:e.marcatore||null,
      assist:(e.assist==='nessuno')?null:(e.assist||null),
      telecamera:telecamera(e)
    }))
  };
}
function apriEsporta(){
  const d=datiEsporta(), testo=JSON.stringify(d,null,1);
  const nome=`catena_${new Date(P.creata).toISOString().slice(0,10)}_${P.avversario.sigla||'OSP'}.json`;
  const p=document.createElement('div'); p.className='pannello';
  p.innerHTML=`<div class="dentro">
    <h1>Manda i dati al computer</h1>
    <div class="gruppo riepilogo">
      CATENA <b>${d.punteggio.noi}</b> — <b>${d.punteggio.loro}</b> ${P.avversario.sigla}
      ${d.giornata?'<br>'+d.giornata+'ª giornata':''}<br>
      ${plur(d.convocati.length,'convocato','convocati')} · ${plur(d.portiere.tiriSubiti,'tiro subito','tiri subiti')}
    </div>
    <div class="gruppo">
      <button class="primario" id="condividi">Condividi</button>
      <button class="secondario" id="scarica" style="margin-top:9px">Scarica il file</button>
      <button class="secondario" id="copia" style="margin-top:9px">Copia negli appunti</button>
      <p class="spiega">Mandalo a te stesso su WhatsApp: è il modo più rapido per farlo arrivare al computer. Il file si chiama <b>${nome}</b>.</p>
    </div>
    <div class="gruppo"><h2>Contenuto</h2><textarea readonly id="ta"></textarea></div>
    <button class="secondario" id="chiudi">Chiudi</button>
  </div>`;
  p.querySelector('#ta').value=testo;
  p.querySelector('#condividi').onclick=async()=>{
    try{
      const file=new File([testo],nome,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title:nome});
      else await navigator.share({title:nome,text:testo});
    }catch(e){}
  };
  p.querySelector('#scarica').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([testo],{type:'application/json'}));
    a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
  p.querySelector('#copia').onclick=async ev=>{
    try{await navigator.clipboard.writeText(testo);ev.target.textContent='Copiato ✓';}
    catch(e){p.querySelector('#ta').select();}
  };
  p.querySelector('#chiudi').onclick=()=>p.remove();
  document.body.appendChild(p);
}

/* ====================== collegamenti ====================== */
carica();
document.getElementById('btnNoi').onclick=()=>segnaGol('noi');
document.getElementById('btnLoro').onclick=()=>segnaGol('loro');
document.getElementById('btnTiro').onclick=()=>{segnaTiro();};
document.getElementById('btnClip').onclick=()=>{const e=aggiungi('clip',{});bip([740,740],.07);vibra(40);flash('neutro','AZIONE SALVATA','sarà negli highlights',e.id);};
document.getElementById('btnGiallo').onclick=()=>{const e=aggiungi('giallo',{squadra:'noi'});bip([520],.12);vibra(70);flash('neutro','GIALLO','tocca nel log per cambiare squadra',e.id);};
document.getElementById('btnRosso').onclick=()=>{const e=aggiungi('rosso',{squadra:'noi'});bip([420,300],.14);vibra([90,60,90]);flash('neutro','ROSSO','tocca nel log per cambiare squadra',e.id);};
document.getElementById('btnAnnulla').onclick=()=>{const e=ultimoAnnullabile();if(e){const d=descrizione(e);const t=(typeof d==='string')?d:d.t;if(confirm('Annullo "'+t+'"?')){rimuovi(e.id);bip([300,200],.1);}}};
document.getElementById('btnFase').onclick=()=>{
  const f=FASI.find(f=>f.k===P.fase); if(!f) return;
  if(f.k==='fine'){apriRiepilogo();return;}
  aggiungi(f.ev,{}); P.fase=f.dopo; salva();
  if(f.ev==='sync'){ if(SR&&!micAcceso)avviaMic(); tieniAcceso(); bip([880,660],.09); }
  else bip([620,760],.1);
  vibra(60); disegna();
};
document.getElementById('micDot').parentElement.onclick=()=>{micAcceso?spegniMic():avviaMic();};
document.querySelector('.sb-wrap').onclick=apriSetup;

disegna();
if(!P.eventi.length && !P.avversario.nome) apriSetup();
</script>
